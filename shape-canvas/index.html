<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ACCESS Shape Canvas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a drafting room. Lockup bar over a 4px gold rule, the shape library on the left, the drawing sheet in the
   middle (white paper and a fine grid in both themes, because the engine draws in fixed ACCESS colours), the details
   panel on the right (sizes, formulas, page), page tabs along the bottom. Panels turn into drawers on narrow screens. */
:root {
  --bg: #F7F4F1;
  --surface: #FFFFFF;
  --surface-2: #FBF9F7;
  --ink: #1A1512;
  --ink-fixed: #1A1512;
  --slate: #4A4E54;
  --muted: #625D58;
  --line: #E5E0DA;
  --line-strong: #CFC8C0;
  --red: #D2181F;
  --red-deep: #C60016;
  --red-text: #B5141B;
  --on-red: #FFFFFF;
  --gold: #FFBC00;
  --gold-soft: #FFEBB2;
  --gold-tint: #FFF8E6;
  --gold-tint-fixed: #FFF8E6;
  --deep-800: #940010;
  --focus: #C60016;
  --paper: #FFFFFF;
  --grid-minor: #EEF0F2;
  --grid-major: #D9DCE0;
  --desk: #E9E5E0;
  --sel: #C60016;
  --handle: #FFBC00;
  --handle-edge: #940010;
  --err-bg: #FAE8E9;
  --err-ink: #9E1217;
  --ok-ink: #5C4300;
  --white: #FFFFFF;
  --scrim: rgba(15, 12, 10, 0.35);
  --shadow: 0 6px 22px rgba(26, 21, 18, 0.16);
  --lcd-bg: rgb(196, 206, 186);
  --lcd-ink: rgb(24, 28, 22);
  /* calculator glow: the one colour exception, orange to red */
  --glow-a: #FF6A00;
  --glow-b: #FF8A00;
  --glow-c: #E10600;
  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 6px;
  --logo-tile: transparent;
  --bar-h: 58px;
  --lib-w: 252px;
  --side-w: 356px;
  --pages-h: 44px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151210; --surface: #1F1B18; --surface-2: #26211D; --ink: #F3EEE9; --slate: #C9C4BE; --muted: #ABA49D;
    --line: #3A332E; --line-strong: #544B44; --red-text: #F08F93; --gold-tint: #2C2414; --focus: #FFBC00;
    --paper: #FBF9F6; --grid-minor: #ECEAE6; --grid-major: #D5D1CB; --desk: #0F0D0B;
    --sel: #C60016; --err-bg: #3A1517; --err-ink: #F7B9BC; --ok-ink: #FFE7A3; --logo-tile: #FFFFFF;
    --shadow: 0 6px 22px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151210; --surface: #1F1B18; --surface-2: #26211D; --ink: #F3EEE9; --slate: #C9C4BE; --muted: #ABA49D;
  --line: #3A332E; --line-strong: #544B44; --red-text: #F08F93; --gold-tint: #2C2414; --focus: #FFBC00;
  --paper: #FBF9F6; --grid-minor: #ECEAE6; --grid-major: #D5D1CB; --desk: #0F0D0B;
  --sel: #C60016; --err-bg: #3A1517; --err-ink: #F7B9BC; --ok-ink: #FFE7A3; --logo-tile: #FFFFFF;
  --shadow: 0 6px 22px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font-body); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
p { margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.fig, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---------- app frame ---------- */
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.bar { position: relative; z-index: 30; display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; min-height: var(--bar-h);
  padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 4px solid var(--gold); }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.lockup { width: 118px; height: auto; flex: none; background: var(--logo-tile); border-radius: 4px; padding: 2px 4px; }
.brand-t { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.brand-name { font: 700 19px/1.1 var(--font-display); color: var(--red-text); letter-spacing: 0.01em; margin: 0; }
.brand-sub { font: 600 11px/1.3 var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.tools { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; flex: 0 1 auto; min-width: 0; }
.bar-end { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.sep { width: 1px; height: 26px; background: var(--line); margin: 0 4px; }
.tb { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 38px; height: 38px; padding: 0 9px; border-radius: var(--radius);
  border: 1px solid transparent; background: transparent; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink); white-space: nowrap; }
.tb svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tb:hover { background: var(--surface-2); border-color: var(--line); }
.tb[aria-pressed="true"] { background: var(--gold-soft); border-color: var(--gold); color: var(--ink-fixed); }
.tb:disabled { opacity: 0.4; cursor: default; }
.tb .tl { font-size: 13px; }
.zoom-pct { min-width: 58px; font-family: var(--font-mono); font-size: 13px; }
.fld { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.sel { height: 36px; padding: 0 8px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--ink); font-weight: 600; font-size: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 6px 12px; border-radius: var(--radius); border: 1.5px solid var(--line-strong);
  background: var(--surface-2); color: var(--ink); font-weight: 600; font-size: 14px; cursor: pointer; text-align: center; }
.btn:hover { border-color: var(--red); }
.btn-primary { background: var(--red); border-color: var(--red); color: var(--on-red); }
.btn-primary:hover { background: var(--red-deep); border-color: var(--red-deep); }
.btn-small { min-height: 30px; padding: 3px 9px; font-size: 13px; }
.btn:disabled { opacity: 0.45; cursor: default; }
.main { position: relative; display: grid; grid-template-columns: var(--lib-w) minmax(0, 1fr) var(--side-w); min-height: 0; }

/* ---------- library ---------- */
.lib { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-right: 1px solid var(--line); }
.lib-head { padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.lib-head h2, .side h2 { font-size: 15px; letter-spacing: 0.02em; }
.panel-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.search { width: 100%; height: 36px; padding: 0 10px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--surface-2); }
.lib-hint { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.lib-list { overflow-y: auto; padding: 6px 10px 16px; flex: 1; }
.lib-group { margin-top: 10px; }
.lib-group h3 { font: 600 11.5px/1.3 var(--font-display); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 6px 2px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px 5px; border-radius: var(--radius); border: 1px solid var(--line);
  background: var(--paper); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; color: var(--ink-fixed); }
.tile:hover { border-color: var(--red); }
.tile svg { width: 58px; height: 44px; pointer-events: none; }
.tile span { font-size: 11px; line-height: 1.2; text-align: center; font-weight: 600; pointer-events: none; overflow-wrap: anywhere; }
.drag-ghost { position: fixed; z-index: 90; pointer-events: none; padding: 6px; border-radius: var(--radius); background: var(--paper); border: 2px solid var(--gold); box-shadow: var(--shadow); color: var(--ink-fixed); }
.drag-ghost svg { width: 70px; height: 54px; display: block; }

/* ---------- stage ---------- */
.stage-wrap { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--desk); }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
#stage.tool-hand, #stage.panning { cursor: grab; }
#stage.tool-pen, #stage.tool-hl { cursor: crosshair; }
#stage.tool-text { cursor: text; }
#stage.tool-eraser { cursor: cell; }
.paper-rect { fill: var(--paper); }
.grid-minor { stroke: var(--grid-minor); }
.grid-major { stroke: var(--grid-major); }
.obj { outline: none; }
.obj:focus-visible .art { filter: drop-shadow(0 0 3px var(--focus)); }
.obj .art { overflow: visible; }
.obj .art path, .obj .art line, .obj .art polyline, .obj .art polygon, .obj .art rect, .obj .art circle, .obj .art ellipse { vector-effect: non-scaling-stroke; }
.obj .art * { pointer-events: none; }
.obj .art path[fill]:not([fill="none"]), .obj .art .dl rect, .obj .art .dl text { pointer-events: visiblePainted; }
.obj .art path[stroke]:not([stroke="none"]) { pointer-events: visiblePainted; }
.obj .note-text, .obj .sum-box, .obj .ink-path, .obj .hit { pointer-events: visiblePainted; }
.obj .hit { fill: transparent; }
#stage.tool-select .obj { cursor: move; }
#stage.tool-select .obj .dl { cursor: pointer; }
#stage.tool-select .obj .dl:hover rect { stroke: var(--sel); stroke-width: 1.5; }
.obj.flash .art, .obj.flash .flashable { animation: flash 1.2s ease-out 1; }
@keyframes flash { 0% { filter: none; } 25% { filter: drop-shadow(0 0 7px var(--gold)) drop-shadow(0 0 2px var(--red-deep)); } 100% { filter: none; } }
.note-text { font-family: var(--font-body); font-weight: 500; }
.sum-box { fill: var(--gold-tint-fixed); stroke: var(--gold); stroke-width: 2; }
.sum-text { font-family: var(--font-body); fill: var(--ink-fixed); }
.sum-text .em { font-weight: 700; }
.ov-box { fill: none; stroke: var(--sel); stroke-width: 1.5; stroke-dasharray: 6 4; pointer-events: none; }
.ov-box.multi { stroke-dasharray: 3 3; }
.ov-handle { fill: var(--handle); stroke: var(--handle-edge); stroke-width: 2; cursor: grab; }
.ov-handle:hover, .ov-handle.active { fill: var(--white); }
.ov-scale { fill: var(--white); stroke: var(--handle-edge); stroke-width: 2; cursor: nwse-resize; }
.ov-rot { fill: var(--white); stroke: var(--handle-edge); stroke-width: 2; cursor: alias; }
.ov-orbit { fill: var(--gold-tint-fixed); stroke: var(--handle-edge); stroke-width: 2; cursor: move; }
.ov-orbit-i { fill: none; stroke: var(--handle-edge); stroke-width: 1.6; pointer-events: none; }
.ov-line { stroke: var(--sel); stroke-width: 1.2; pointer-events: none; }
.ov-tag { font: 700 12px var(--font-mono); fill: var(--ink-fixed); pointer-events: none; }
.ov-tagbg { fill: var(--gold-tint-fixed); stroke: var(--deep-800); stroke-width: 1; pointer-events: none; }
.ov-marquee { fill: rgba(255, 188, 0, 0.12); stroke: var(--sel); stroke-width: 1; stroke-dasharray: 4 3; pointer-events: none; }
.ov-snap { fill: none; stroke: var(--red-deep); stroke-width: 2; pointer-events: none; }
.ov-family { fill: none; stroke: var(--gold); stroke-width: 1.5; stroke-dasharray: 2 4; pointer-events: none; }
.stage-hint { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); width: max-content; max-width: min(560px, calc(100% - 32px)); padding: 6px 12px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); color: var(--slate); font-size: 13px; text-align: center; box-shadow: var(--shadow); pointer-events: none; }
.toast { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: max-content; max-width: min(560px, calc(100% - 32px)); padding: 8px 14px; border-radius: var(--radius);
  background: var(--ink); color: var(--bg); font-size: 14px; box-shadow: var(--shadow); z-index: 25; }
.toast.err { background: var(--err-bg); color: var(--err-ink); border: 1px solid var(--red); }

/* ---------- details panel ---------- */
.side { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-left: 1px solid var(--line); }
.side-tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; align-items: stretch; }
.side-tab { flex: 1; height: 42px; border: 0; border-bottom: 3px solid transparent; background: transparent; font-weight: 600; font-size: 14px; cursor: pointer; color: var(--muted); }
.side-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--red); }
.side-body { overflow-y: auto; padding: 14px 14px 90px; flex: 1; }
.side-x { display: none; }
.sec { display: flex; flex-direction: column; gap: 8px; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.sec:last-child { border-bottom: 0; }
.sec h3 { font-size: 14px; letter-spacing: 0.02em; }
.eyebrow { font: 600 11.5px/1.3 var(--font-display); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.obj-title { font: 700 20px/1.2 var(--font-display); color: var(--red-text); }
.muted { color: var(--muted); font-size: 13.5px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.dimrow { display: grid; grid-template-columns: minmax(0, 1fr) 132px; gap: 4px 8px; align-items: center; }
.dimrow label { font-size: 13.5px; line-height: 1.3; }
.dimrow label b { font-family: var(--font-mono); font-weight: 600; color: var(--red-text); margin-right: 4px; }
.dimrow input { width: 100%; height: 34px; padding: 0 8px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--surface-2); font-family: var(--font-mono); font-size: 14px; }
.dimrow input[aria-invalid="true"] { border-color: var(--red); background: var(--err-bg); }
.dimrow .out { font-family: var(--font-mono); font-size: 14px; text-align: right; padding-right: 2px; }
.err { padding: 6px 10px; border-radius: var(--radius); background: var(--err-bg); color: var(--err-ink); border-left: 4px solid var(--red); font-size: 13.5px; }
.note { padding: 8px 12px; border-left: 4px solid var(--gold); background: var(--gold-tint); border-radius: 0 6px 6px 0; font-size: 13.5px; line-height: 1.5; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
.chk input { width: 18px; height: 18px; accent-color: var(--red); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; }
.seg button { border: 0; background: var(--surface-2); padding: 6px 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--gold-soft); color: var(--ink-fixed); }
.range { display: grid; grid-template-columns: 74px minmax(0, 1fr) 46px; gap: 8px; align-items: center; font-size: 13.5px; }
.range input { width: 100%; accent-color: var(--red); }
.linkrow { display: flex; gap: 6px; align-items: center; justify-content: space-between; font-size: 13.5px; padding: 6px 8px; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--line); }
.linkrow span { min-width: 0; overflow-wrap: anywhere; }
.form-grid { display: grid; grid-template-columns: 1fr; gap: 6px; }
.form-grid label { font-size: 13px; font-weight: 600; color: var(--muted); }
.form-grid select, .form-grid input { width: 100%; height: 34px; padding: 0 8px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--surface-2); }
.totals { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 14px; }
.totals .v { font-family: var(--font-mono); text-align: right; }
.layer { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 6px; align-items: center; padding: 4px 6px; border-radius: var(--radius); border: 1px solid var(--line); }
.layer.on { border-color: var(--gold); background: var(--gold-tint); }
.layer input[type="text"] { width: 100%; border: 0; background: transparent; font-weight: 600; font-size: 14px; padding: 4px; }
.icon-btn { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; }
.icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn[aria-pressed="true"] { background: var(--gold-soft); border-color: var(--gold); color: var(--ink-fixed); }

/* ---------- formulas ---------- */
.ci { padding: 10px 0 12px; border-top: 1px solid var(--line); }
.ci:first-child { border-top: 0; }
.ci h4 { font: 600 15px/1.3 var(--font-body); margin-bottom: 4px; }
.ln { font-family: var(--font-mono); font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }
.ln.ans { font-weight: 600; }
.chips { display: block; margin: 6px 0 4px; line-height: 1.9; }
.ci-run { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ci.running { margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 10px; }
.term { font: inherit; color: inherit; background: none; border: 0; margin: 0; padding: 0 1px; cursor: pointer; border-radius: 3px;
  text-decoration: underline dotted; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.term:hover { background: var(--gold-soft); color: var(--ink-fixed); }
.term-def { margin-top: 6px; padding: 8px 10px; border-left: 5px solid var(--glow-b); background: var(--surface-2); border-radius: 0 6px 6px 0; font-size: 13.5px; }
.sumline { font-family: var(--font-mono); font-size: 13.5px; line-height: 1.6; overflow-wrap: anywhere; }
.check-ok { color: var(--ok-ink); font-weight: 600; }

/* ---------- glow while the calculator runs (orange and red on purpose, outside the brand palette, screen only) ---------- */
@keyframes hlFill { from { fill: #FF6A00; fill-opacity: 0.42; } to { fill: #E10600; fill-opacity: 0.58; } }
@keyframes hlLine { from { stroke: #FF6A00; stroke-width: 6.5px; } to { stroke: #E10600; stroke-width: 9px; } }
@keyframes ciPulse { from { box-shadow: 0 0 0 3px #FF8A00, 0 0 14px 3px rgba(255, 138, 0, 0.55); } to { box-shadow: 0 0 0 3px #E10600, 0 0 26px 8px rgba(225, 6, 0, 0.5); } }
@keyframes tkPulse { from { background: #FF8A00; box-shadow: 0 0 8px 2px rgba(255, 138, 0, 0.9); } to { background: #E10600; color: #FFFFFF; box-shadow: 0 0 16px 5px rgba(225, 6, 0, 0.75); } }
@keyframes termPulse { from { background: #FF8A00; box-shadow: 0 0 0 2px #FF6A00, 0 0 8px 2px rgba(255, 106, 0, 0.6); } to { background: #FFB04D; box-shadow: 0 0 0 2px #E10600, 0 0 16px 5px rgba(225, 6, 0, 0.55); } }
@media screen {
  .obj .art .hl-fill { fill: #FF6A00; fill-opacity: 0.45; animation: hlFill 1.1s ease-in-out infinite alternate; }
  .obj .art .hl-line { stroke: #FF6A00; stroke-width: 7px; filter: drop-shadow(0 0 3px #FF6A00) drop-shadow(0 0 9px #E10600); animation: hlLine 1.1s ease-in-out infinite alternate; }
  .ci.running { box-shadow: 0 0 0 3px #FF8A00, 0 0 18px 4px rgba(255, 138, 0, 0.55); animation: ciPulse 1.1s ease-in-out infinite alternate; }
  .tk.is-run { background: #FF8A00; color: #1A1A1A; border-color: #E10600; outline: 3px solid #E10600; outline-offset: 1px; box-shadow: 0 0 10px 3px rgba(255, 138, 0, 0.9); animation: tkPulse 0.55s ease-in-out infinite alternate; }
  .term.term-on { background: #FF8A00; color: #1A1A1A; box-shadow: 0 0 0 2px #E10600, 0 0 10px 3px rgba(255, 138, 0, 0.7); animation: termPulse 1.1s ease-in-out infinite alternate; }
}
@media screen and (prefers-reduced-motion: reduce) {
  .obj .art .hl-fill { animation: none; fill: #FF6A00; fill-opacity: 0.5; }
  .obj .art .hl-line { animation: none; stroke: #E10600; stroke-width: 8px; }
  .ci.running { animation: none; box-shadow: 0 0 0 3px #E10600, 0 0 18px 4px rgba(255, 138, 0, 0.6); }
  .tk.is-run { animation: none; }
  .term.term-on { animation: none; }
  .obj.flash .art, .obj.flash .flashable { animation: none; }
}

/* ---------- pop-ups ---------- */
.pop { position: fixed; z-index: 80; background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: var(--shadow); }
.dim-editor { width: min(300px, calc(100vw - 24px)); padding: 12px; display: flex; flex-direction: column; gap: 8px; border-top: 4px solid var(--gold); }
.dim-editor h3 { font-size: 15px; }
.dim-editor input[type="text"] { width: 100%; height: 40px; padding: 0 10px; border-radius: var(--radius); border: 1.5px solid var(--line-strong); background: var(--surface-2); font-family: var(--font-mono); font-size: 16px; }
.dim-editor select { width: 100%; height: 34px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--surface-2); padding: 0 8px; }
.menu { width: min(300px, calc(100vw - 24px)); padding: 6px; display: flex; flex-direction: column; max-height: calc(100% - 90px); overflow-y: auto; }
.menu button.mi { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 10px; border: 0; background: transparent; border-radius: var(--radius); cursor: pointer; font-weight: 500; font-size: 14px; }
.menu button.mi:hover, .menu button.mi:focus-visible { background: var(--gold-tint); }
.menu .mh { padding: 8px 10px 4px; font: 600 11px/1.3 var(--font-display); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.menu .mrow { display: flex; align-items: center; gap: 8px; padding: 6px 10px; flex-wrap: wrap; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
.confirm { width: min(340px, calc(100vw - 24px)); padding: 14px; display: flex; flex-direction: column; gap: 10px; border-top: 4px solid var(--red); }
.textedit { position: fixed; z-index: 85; min-width: 160px; min-height: 40px; padding: 6px 8px; border: 2px solid var(--gold); border-radius: 4px; background: var(--white); color: var(--ink-fixed); font-family: var(--font-body); resize: both; }

/* ---------- pages ---------- */
.pages { display: flex; align-items: center; gap: 6px; min-height: var(--pages-h); padding-block: 4px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-top: 1px solid var(--line); overflow-x: auto; }
.page-tab { flex: none; height: 32px; padding: 0 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; font-size: 13.5px; cursor: pointer; }
.page-tab[aria-selected="true"] { background: var(--gold-soft); border-color: var(--gold); color: var(--ink-fixed); }
.page-tab input { width: 120px; border: 0; background: transparent; font-weight: 600; }
.pages .spacer { flex: 1; min-width: 8px; }
.present-nav { display: none; }

/* ---------- calculator: keep the button clear of the page tabs ---------- */
.ti-fab { bottom: calc(var(--pages-h) + 16px + env(safe-area-inset-bottom, 0px)) !important; }
.fb-pop { position: fixed; right: 16px; bottom: calc(var(--pages-h) + 72px); z-index: 70; width: 260px; padding: 10px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; }
.fb-head { display: flex; justify-content: space-between; align-items: center; }
.fb-x { border: 0; background: transparent; font-size: 20px; cursor: pointer; }
.fb-lcd { padding: 8px 10px; border-radius: 6px; background: var(--lcd-bg); color: var(--lcd-ink); font: 600 22px/1.2 var(--font-mono); text-align: right; }
.fb-tape { line-height: 1.9; }
.fb-stop { align-self: flex-start; }
.ti-fab.fallback-fab { position: fixed; right: 16px; z-index: 60; padding: 10px 16px; border-radius: 999px; border: 0; background: var(--red); color: var(--on-red); font-weight: 600; box-shadow: var(--shadow); }

/* ---------- presenter ---------- */
body.presenter .lib, body.presenter .side { display: none !important; }
body.presenter .main { grid-template-columns: minmax(0, 1fr); }
body.presenter .brand-sub, body.presenter .wide, body.presenter .edit-only { display: none !important; }
body.presenter .present-nav { display: inline-flex; }
body.presenter .stage-hint { display: none; }
body.presenter .tb { height: 44px; min-width: 44px; font-size: 16px; }
body.presenter .page-tab { height: 36px; font-size: 15px; }

/* ---------- medium screens: icons only in the toolbar ---------- */
@media (max-width: 1439px) {
  .tools .tb .tl, .bar-end .fld > span, .brand-sub { display: none; }
  .tb { min-width: 36px; padding: 0 7px; }
  .fld-units { display: none !important; }
}
/* ---------- narrower screens: the panels become drawers ---------- */
.only-narrow, .only-mid { display: none !important; }
.scrim { position: fixed; inset: 0; z-index: 35; background: var(--scrim); }
@media (max-width: 1180px) {
  .bar-end .tb .tl, .bar-end .fld { display: none !important; }
  .main { grid-template-columns: var(--lib-w) minmax(0, 1fr); }
  .side { position: fixed; top: 0; right: 0; bottom: 0; z-index: 40; width: min(380px, 92vw); transform: translateX(105%); transition: transform 0.2s ease;
    box-shadow: var(--shadow); padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); visibility: hidden; }
  .side.open { transform: none; visibility: visible; }
  .side-x { display: inline-flex; }
  .only-mid { display: inline-flex !important; }
}
@media (max-width: 860px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .lib { position: fixed; top: 0; left: 0; bottom: 0; z-index: 40; width: min(320px, 88vw); transform: translateX(-105%); transition: transform 0.2s ease;
    box-shadow: var(--shadow); padding-top: env(safe-area-inset-top, 0px); padding-left: env(safe-area-inset-left, 0px); visibility: hidden; }
  .lib.open { transform: none; visibility: visible; }
  .only-narrow { display: inline-flex !important; }
  .wide { display: none !important; }
  .lockup { width: 92px; }
  .brand-sub { display: none; }
  .bar { gap: 6px 8px; }
  .tools { order: 3; flex-basis: 100%; justify-content: space-between; gap: 2px; }
  .bar-end { margin-left: auto; }
  .tb { min-width: 38px; height: 40px; padding: 0 6px; }
  .tb .tl { display: none; }
  .sep { display: none; }
}
@media (max-width: 420px) {
  .brand-name { font-size: 17px; }
  .tb { min-width: 34px; padding: 0 4px; }
  .tb svg { width: 19px; height: 19px; }
}
@media (prefers-reduced-motion: reduce) {
  .side, .lib { transition: none; }
}

<script id="js-shapes-engine">
/*
 * ACCESS Shape Engine
 * Flat shapes, 3D solids and nets as PowerPoint-safe SVG, plus worked calculations.
 * Browser: window.Shapes. Node: module.exports. No dependencies.
 *
 * API
 *   Shapes.list()                         -> [{id, name, kind, group, params, hasNet}]
 *   Shapes.info(id)                       -> same record for one shape
 *   Shapes.defaults(id)                   -> {param: value}
 *   Shapes.validate(id, params)           -> null or {k, msg}
 *   Shapes.random(id, mode)               -> params ('whole' | 'half' | 'tenth')
 *   Shapes.render(id, params, opts)       -> SVG string (flat shape or 3D view)
 *   Shapes.net(id, params, opts)          -> SVG string, or null when the solid has no net
 *   Shapes.calc(id, params, units, ao)    -> {items:[{name, sym, key, value, unit, lines[], hl[]}], notes[]}
 *   Shapes.layout(id, params, units)      -> {items, notes} layout math for the flat pattern (solids with a net), or null
 *   Shapes.angleParams(id)                -> angle-input parameter list for a triangle, or null
 *   opts: labels 'letters'|'values'|'both'|'none', plain bool, units 'mm'|'cm'|'m'|'in'|'ft',
 *         derived 'show'|'ask'|'hide' (or true/false), hidden bool (3D hidden edges),
 *         yaw, pitch (degrees), thumb bool, frame [x,y,w,h], zoom number,
 *         angles bool and angleInput 'sides'|'angle' (triangles), hl [part strings] (glow layer, screen only)
 *   ao (angle options for defaults/validate/random/calc): {angles: bool, angleInput: 'sides'|'angle'}
 *   hl parts: fill, outline, all, side, inner, bottom, top, ends, panels:lat|base|top|all, blank, folds, dim:<letter>, ang:<letter>
 *   Shapes.terms()                        -> glossary {key: {label, def, hl(id, params, view, opts)}}
 *   Shapes.termParts(key, id, params, opts) -> the hl parts that term lights on this drawing ([] = definition only)
 *   Shapes.findTerms(text)                -> [{start, end, key}] glossary words found in a piece of text
 */

  function add(a, b) { return a.length === 3 ? [a[0] + b[0], a[1] + b[1], a[2] + b[2]] : [a[0] + b[0], a[1] + b[1]]; }

  function dot(a, b) { return a.length === 3 ? a[0] * b[0] + a[1] * b[1] + a[2] * b[2] : a[0] * b[0] + a[1] * b[1]; }
